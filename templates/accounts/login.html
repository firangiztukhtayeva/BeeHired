{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Tizimga kirish — BeeHired 🐝{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0 rounded-4 mt-3">
            <div class="card-body p-4 p-md-5">
                <!-- Sarlavha va Asalari Emojisi -->
                <div class="text-center mb-4">
                    <span class="fs-1">🐝</span>
                    <h3 class="fw-bold mt-2 mb-1">Xush kelibsiz!</h3>
                    <p class="text-muted small">Tizimga kirish uchun ma'lumotlaringizni kiriting</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-dark w-100 fw-bold mt-3 py-2 shadow-sm rounded-3">
                        Tizimga kirish
                    </button>
                </form>

                <p class="text-center mt-4 mb-0 text-muted">
                    Akkauntingiz yo'qmi? <a href="{% url 'accounts:register' %}" class="text-warning text-decoration-none fw-bold">Ro'yxatdan o'tish 🐝</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
